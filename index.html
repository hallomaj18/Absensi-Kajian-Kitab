<style>
  html, body, #root { height: 100%; }
  body { margin: 0; --font-display: 'Lora', serif; --font-body: 'IBM Plex Sans', sans-serif; font-family: var(--font-body); }
  #boot-msg { display: flex; align-items: center; justify-content: center; height: 100%; color: #6B5F4E; font-family: var(--font-body); font-size: 14px; }
</style>

<body>
  <div id="root"><div id="boot-msg">Memuat aplikasi…</div></div>

  <script type="text/babel" data-presets="react" src="app.jsx"></script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch((err) => {
          console.warn("Service worker gagal didaftarkan:", err);
        });
      });
    }
  </script>
</body>
